<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Терминал прогноза · Nasdaq-100</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Cpath d='M0 0h10v10H4V4H0z' fill='%23f0a63a'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Терминал прогноза</span>
        <span class="brand-ver">v1.0</span>
      </div>
      <span class="topbar-sep"></span>
      <span class="topbar-market">Рынок <b>NASDAQ-100</b> · <span id="market-count" class="num">—</span> бумаг · дневные свечи</span>
      <div class="topbar-keys">
        <span><kbd>/</kbd> поиск</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> бумага</span>
        <span><kbd>1</kbd>–<kbd>4</kbd> модель</span>
      </div>
      <button class="ai-toggle" id="ai-toggle" aria-pressed="false"><span class="ai-dot"></span>ИИ-аналитик <kbd>I</kbd></button>
      <div class="acct" id="account"></div>
    </header>
    <div class="tape" id="tape"></div>
    <section class="panel" id="watchlist"></section>
    <section class="panel" id="chart"></section>
    <aside class="panel" id="model"></aside>
    <section class="panel" id="comparison"></section>
    <section class="panel" id="heatmap"></section>
    <footer class="statusbar">
      <span class="dot" id="conn-dot"></span>
      <span class="disclaimer">Учебный проект. Не является инвестиционной рекомендацией.</span>
      <span class="spacer"></span>
      <span>Данные на <span class="num" id="data-asof">—</span></span>
      <span>Состав индекса на <span class="num" id="universe-asof">—</span></span>
      <span>Источник: Yahoo Finance</span>
    </footer>
  </div>
  <aside class="ai-drawer" id="ai" aria-label="ИИ-аналитик"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
